<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Incorporando Iframes</title>
    <style>
        div.container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
    </style>
</head>
<body>
    <h1>Iframes interessantes</h1>
    <div class="container">
        <div>
            <h2>Youtube</h2>
            <p>Aqui está um vídeo do canal do Curso em Vìdeo</p>
            <iframe width="560" height="315" src="https://www.youtube.com/embed/dzhJsc1YszU?si=0cJJ9GQJ8oP84AO2" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
        <div>
            <h2>Google maps</h2>
            <p>Aqui está o mapa da Unifor</p>
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3981.19008949763!2d-38.478061!3d-3.7687752999999997!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x7c745fe9c03245d%3A0xd435fd5a6bfbbe44!2sUNIFOR%20-%20Universidade%20de%20Fortaleza!5e0!3m2!1spt-BR!2sbr!4v1774979386361!5m2!1spt-BR!2sbr" width="560" height="315" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
        <div>
            <h2>Apresentação</h2>
            <p>Incorporando slides</p>
            <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vR97JTCIFPNn_XvgGYLFgbqozhemZLlPJXZ9vA7ZMS59fFaFN029_7cpOrRkyPZFVcAQlUGoHV_lxO4/pubembed?start=false&loop=false&delayms=3000" frameborder="0" width="640" height="389" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
        </div>
    </div>
</body>
</html>
