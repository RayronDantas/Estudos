<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>

    <h1>Beta Test</h1>
    
    <h2>Aqui está um formulário com autocomplete</h2>
    <form action="cadastro.php" autocomplete="off">
            <p>
                <label for="name">Nome:</label>
                <input type="text" name="name" id="name">
            </p>
        <p>
            <label for="surname">Sobrenome:</label> 
            <input type="text" name="surname" id="surname" autocomplete="new-password">
        </p>
        <input type="submit" value="Enviar">
    </form>

    <h2>Aqui está um formulário com autocomplete desativado</h2>
    <form action="" autocomplete="off">
        <p>Nome da mãe: <input type="text" name="mother" id="mother_name"></p>
    </form>
</body>
</html>
